name: Database (migrate / seed)

# Manually-triggered schema migration + reference data seeding against the
# managed database (TiDB Cloud / MySQL). Run once after first configuring
# secrets, and again whenever the data model changes.
#
# Note: we compile to JS and run the compiled output with `node` so we never
# depend on ts-node being present at runtime. NODE_ENV is only set on the run
# steps (not during install) so devDependencies still install for the build.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - migrate
          - seed
          - both

env:
  SKIP_DB_BOOTSTRAP: 'true'
  DB_SSL: 'true'
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (incl. dev)
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run schema migration
        if: ${{ inputs.action == 'migrate' || inputs.action == 'both' }}
        env:
          NODE_ENV: production
        run: node dist/scripts/migrate.js

      - name: Seed roles, statuses, demo org + users
        if: ${{ inputs.action == 'seed' || inputs.action == 'both' }}
        env:
          NODE_ENV: production
        run: |
          node dist/scripts/seed-roles.js
          node dist/scripts/seed-ticket-status.js
          node dist/scripts/seed-users.js