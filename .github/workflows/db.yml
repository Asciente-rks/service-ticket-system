name: Database (migrate / seed)

# Manually-triggered schema migration + reference data seeding against the
# managed database (TiDB Cloud / MySQL). Run once after first configuring
# secrets, and again whenever the data model changes.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - migrate
          - seed
          - both

env:
  NODE_ENV: production
  SKIP_DB_BOOTSTRAP: 'true'
  DB_SSL: 'true'
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run schema migration
        if: ${{ inputs.action == 'migrate' || inputs.action == 'both' }}
        run: npm run db:migrate

      - name: Seed roles, statuses, demo org + users
        if: ${{ inputs.action == 'seed' || inputs.action == 'both' }}
        run: npm run seed:all